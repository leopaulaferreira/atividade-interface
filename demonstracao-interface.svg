<svg width="1200" height="820" viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Demonstração da interface" >
  <defs>
    <style>
      .bg { fill: #efefef; }
      .panel { fill: #f7f7f7; stroke: #d8d8d8; stroke-width: 2; }
      .title { font: 700 38px Arial, sans-serif; fill: #2a2a2a; }
      .label { font: 700 28px Arial, sans-serif; fill: #2f2f2f; }
      .field { fill: #fafafa; stroke: #d3d3d3; stroke-width: 2; rx: 8; }
      .menu-line { fill: none; stroke: #d7d7d7; stroke-width: 2; }
      .menu-text { font: 300 24px Arial, sans-serif; fill: #2b2b2b; }
      .tab-btn { fill: #f1f1f1; stroke: #cfcfcf; stroke-width: 2; }
      .tab-btn-active { fill: #3e3e3e; stroke: #3e3e3e; }
      .tab-text { font: 500 22px Arial, sans-serif; }
      .tab-text-active { fill: #ffffff; }
      .tab-text-inactive { fill: #2f2f2f; }
      .content { fill: #fafafa; stroke: #d9d9d9; stroke-width: 2; }
      .content-text { font: 400 24px Arial, sans-serif; fill: #2e2e2e; }
      .btn-blue { fill: #2e7ef7; }
      .btn-text { font: 700 20px Arial, sans-serif; fill: #ffffff; }
      .modal-overlay { fill: rgba(0,0,0,0.35); }
      .modal-box { fill: white; stroke: #d9d9d9; stroke-width: 2; }
      .modal-text { font: 400 22px Arial, sans-serif; fill: #2d2d2d; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="820"/>

  <rect class="panel" x="120" y="60" width="960" height="680" rx="18"/>

  <text x="170" y="135" class="title">Busca por categorias</text>

  <rect x="170" y="175" width="840" height="62" class="field" rx="8"/>
  <text x="200" y="217" class="menu-text" fill="#909090">Pesquisar...</text>

  <g>
    <line x1="170" y1="255" x2="1010" y2="255" class="menu-line"/>
    <text x="180" y="300" class="menu-text">HTML</text>
    <line x1="170" y1="322" x2="1010" y2="322" class="menu-line"/>
    <text x="180" y="365" class="menu-text">CSS</text>
    <line x1="170" y1="387" x2="1010" y2="387" class="menu-line"/>
    <text x="180" y="430" class="menu-text">JavaScript</text>
    <line x1="170" y1="452" x2="1010" y2="452" class="menu-line"/>
    <text x="180" y="495" class="menu-text">PHP</text>
    <line x1="170" y1="517" x2="1010" y2="517" class="menu-line"/>
    <text x="180" y="560" class="menu-text">Python</text>
    <line x1="170" y1="582" x2="1010" y2="582" class="menu-line"/>
    <text x="180" y="625" class="menu-text">jQuery</text>
    <line x1="170" y1="647" x2="1010" y2="647" class="menu-line"/>
    <text x="180" y="690" class="menu-text">SQL</text>
    <line x1="170" y1="712" x2="1010" y2="712" class="menu-line"/>
    <text x="180" y="755" class="menu-text">Bootstrap</text>
    <line x1="170" y1="777" x2="1010" y2="777" class="menu-line"/>
    <text x="180" y="820" class="menu-text">Node.js</text>
  </g>

  <g transform="translate(0,-50)">
    <text x="170" y="505" class="label">Abas</text>
    <rect x="170" y="530" width="118" height="48" rx="8" class="tab-btn-active"/>
    <text x="210" y="563" class="tab-text tab-text-active">Home</text>

    <rect x="298" y="530" width="118" height="48" rx="8" class="tab-btn"/>
    <text x="330" y="563" class="tab-text tab-text-inactive">Sobre</text>

    <rect x="426" y="530" width="128" height="48" rx="8" class="tab-btn"/>
    <text x="456" y="563" class="tab-text tab-text-inactive">Contato</text>

    <rect x="170" y="595" width="840" height="72" rx="10" class="content"/>
    <text x="205" y="640" class="content-text">Conteúdo da aba Home. Aqui você pode mostrar uma introdução ao projeto.</text>
  </g>

  <rect x="170" y="700" width="145" height="48" rx="10" class="btn-blue"/>
  <text x="205" y="732" class="btn-text" text-anchor="middle">Abrir modal</text>
</svg>
